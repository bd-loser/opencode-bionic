name: watch-upstream

# Polls anomalyco/opencode (fka sst/opencode) for new work every 12 hours.
# Three responsibilities:
#
# 1. Bump: if upstream has a RELEASE version we haven't shipped, bump
#    versions.json, commit to main, and dispatch release.yml. The dispatch
#    mirrors upstream's `prerelease` flag verbatim — if upstream shipped it
#    stable, we ship it stable (Latest); if upstream shipped it as a
#    prerelease, so do we.
#
# 2. Dev: otherwise, if upstream's `dev` branch has COMMITS we haven't built,
#    dispatch a build of that exact commit as a prerelease, tagged
#    v<version>-dev.<short-sha>. Never Latest — install.sh's default channel
#    follows /releases/latest, so a dev build can only reach users who ask
#    for it by name (OPENCODE_CHANNEL=prerelease or OPENCODE_COMMIT=<sha>).
#
#    A pending stable bump wins: step 1 and step 2 never dispatch in the same
#    run, because the stable build is the one users actually get.
#
# 3. Promote: for tags we've already released, sync our `prerelease` flag
#    to upstream's. Handles the case where upstream promoted a prerelease
#    to stable (or demoted a stable to prerelease) after we mirrored it.
#    Users on install.sh follow /releases/latest, which excludes prereleases,
#    so promotion here is what actually moves users onto a new version.
#
#    Dev builds are exempt: their tags don't exist upstream, so the lookup
#    misses and they keep the prerelease flag they were born with.
#
# Inputs:
#   dry_run         — report what would happen; don't commit or dispatch
#   force_version   — force bump to this upstream version (skip auto-detect)
#   skip_dev        — don't build dev commits this run (stable bumps only)

on:
  schedule:
    # 02:17 and 14:17 UTC. Off-minute on purpose: the top of the hour is
    # when every other cron on the platform fires.
    - cron: "17 2,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would happen, but don't commit or dispatch."
        type: boolean
        default: false
      force_version:
        description: "Force bump to this upstream version (leave blank to auto-detect)."
        type: string
        default: ""
      skip_dev:
        description: "Skip the dev-branch prerelease build this run."
        type: boolean
        default: false
      draft:
        description: "Create any release dispatched by this run as a draft."
        type: boolean
        default: false

concurrency:
  group: watch-upstream
  cancel-in-progress: false

env:
  UPSTREAM: anomalyco/opencode
  OURS: ${{ github.repository }}

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Sync stability of existing releases
        # Runs first, and unconditionally: even if no upstream bump is
        # pending, our prerelease flags may drift from upstream (e.g.
        # upstream promoted a version to stable after we mirrored it).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Get last 20 of our releases and their prerelease flags.
          gh release list --repo "$OURS" -L 20 \
              --json tagName,isPrerelease,isDraft --jq '.[]' > ours.jsonl || true
          if [ ! -s ours.jsonl ]; then
            echo "no releases in $OURS yet; nothing to sync."
            exit 0
          fi
          flipped=0
          # Iterate deterministically. jq -c produces one JSON object per line.
          while IFS= read -r row; do
            tag="$(echo "$row" | jq -r .tagName)"
            our_pre="$(echo "$row" | jq -r .isPrerelease)"
            our_draft="$(echo "$row" | jq -r .isDraft)"
            [ "$our_draft" = "true" ] && continue  # never touch drafts
            # Look up upstream by exact tag. Missing → skip silently.
            up_json="$(gh release view "$tag" --repo "$UPSTREAM" --json isPrerelease 2>/dev/null || true)"
            [ -z "$up_json" ] && continue
            up_pre="$(echo "$up_json" | jq -r .isPrerelease)"
            if [ "$our_pre" != "$up_pre" ]; then
              echo "  $tag: ours=prerelease:$our_pre upstream=prerelease:$up_pre → flipping"
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                echo "    (dry-run: skipping edit)"
              else
                # gh release edit --prerelease is a tri-state:
                #   --prerelease=true   → mark prerelease
                #   --prerelease=false  → mark stable
                gh release edit "$tag" --repo "$OURS" --prerelease="$up_pre"
                flipped=$((flipped + 1))
              fi
            fi
          done < ours.jsonl
          echo "flipped $flipped release(s) to match upstream stability."

      - name: Detect upstream latest
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCED: ${{ inputs.force_version }}
        run: |
          set -eu
          if [ -n "$FORCED" ]; then
            LATEST="${FORCED#v}"
            echo "using forced version: $LATEST"
            # We don't know upstream's flag for a forced bump; look it up.
            UP_PRE="$(gh release view "v$LATEST" --repo "$UPSTREAM" --json isPrerelease --jq .isPrerelease 2>/dev/null || echo false)"
          else
            # Include prereleases: we mirror upstream's flag, so the newest
            # tag wins regardless of stability. --exclude-drafts still applies.
            # Filter to semver-shaped tags (vX.Y.Z) — upstream occasionally
            # publishes PR-preview releases with tags like `pr-37967-screenshots`
            # that we can't build (they're not tagged commits we clone by).
            row="$(gh release list --repo "$UPSTREAM" --exclude-drafts -L 20 \
                --json tagName,isPrerelease \
                --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0]')"
            if [ -z "$row" ] || [ "$row" = "null" ]; then
              echo "error: could not resolve latest $UPSTREAM release" >&2
              exit 1
            fi
            LATEST_TAG="$(echo "$row" | jq -r .tagName)"
            UP_PRE="$(echo "$row" | jq -r .isPrerelease)"
            LATEST="${LATEST_TAG#v}"
          fi
          CURRENT="$(jq -r '.opencode' versions.json)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "upstream_prerelease=$UP_PRE" >> "$GITHUB_OUTPUT"
          echo "current opencode-bionic pin: $CURRENT"
          echo "latest $UPSTREAM release: $LATEST (prerelease=$UP_PRE)"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no bump needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versions.json + refresh README
        if: steps.upstream.outputs.changed == 'true'
        env:
          NEW: ${{ steps.upstream.outputs.latest }}
        run: |
          set -eu
          jq --arg v "$NEW" '.opencode = $v' versions.json > versions.json.new
          mv versions.json.new versions.json
          # No upstream tree present in the repo now, so `apply` only rewrites
          # the README badge/table (targeting REPO_ROOT). `check` follows to
          # confirm nothing regressed.
          bun termux/ci/versions.ts apply
          bun termux/ci/versions.ts check
          echo "diff:"
          git --no-pager diff --stat

      - name: Preflight — patches apply cleanly against new upstream
        # Root cause we're protecting against: if upstream renames or reformats
        # a file we patch (bunfig.toml, fff.bun.ts, build-termux.ts), git am
        # --3way fails, and the release run would fail hours later. Fail fast
        # HERE instead so the maintainer sees a red bump job with the failing
        # patch pointed out, and can regenerate patches before dispatching.
        if: steps.upstream.outputs.changed == 'true'
        env:
          NEW: ${{ steps.upstream.outputs.latest }}
        run: |
          set -eu
          SCRATCH="$RUNNER_TEMP/preflight-v$NEW"
          bash termux/ci/prepare-build-tree.sh "$SCRATCH"
          echo "preflight OK — patches apply cleanly to upstream v$NEW"

      - name: Verify tag is unused
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.upstream.outputs.latest }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$OURS" >/dev/null 2>&1; then
            echo "error: release $TAG already exists in $OURS. Delete it or bump manually." >&2
            exit 1
          fi

      - name: Commit + push (skipped on dry_run)
        if: steps.upstream.outputs.changed == 'true' && inputs.dry_run != true
        env:
          NEW: ${{ steps.upstream.outputs.latest }}
          OLD: ${{ steps.upstream.outputs.current }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the repo-owned files change on a bump now: versions.json is
          # the source of truth, README.md carries the versioned badge/table.
          git add versions.json README.md
          git commit -m "chore(upstream): bump opencode $OLD → $NEW" \
                     -m "Auto-bumped by watch-upstream.yml from $UPSTREAM."
          git push origin HEAD:main

      - name: Dispatch release (mirror upstream stability)
        if: steps.upstream.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.upstream.outputs.latest }}
          UP_PRE: ${{ steps.upstream.outputs.upstream_prerelease }}
          DRAFT: ${{ inputs.draft || false }}
        run: |
          set -eu
          gh workflow run release.yml \
            --ref main \
            -f version="$NEW" \
            -f draft="$DRAFT" \
            -f prerelease="$UP_PRE"
          echo "dispatched release.yml for v$NEW (prerelease=$UP_PRE)"

      - name: Dry-run summary
        if: steps.upstream.outputs.changed == 'true' && inputs.dry_run == true
        env:
          NEW: ${{ steps.upstream.outputs.latest }}
          OLD: ${{ steps.upstream.outputs.current }}
          UP_PRE: ${{ steps.upstream.outputs.upstream_prerelease }}
        run: |
          echo "DRY RUN: would bump $OLD → $NEW, commit to main, and dispatch release.yml with prerelease=$UP_PRE."

      # ── dev channel ──────────────────────────────────────────────────────
      #
      # Only reached when there is no stable bump pending. A stable release
      # and a dev build of the same tree are the same binary as far as users
      # are concerned, and dispatching both would race two 45-minute builds
      # against each other for no gain.

      - name: Detect new upstream dev commits
        id: dev
        if: steps.upstream.outputs.changed != 'true' && inputs.skip_dev != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SHA="$(gh api "repos/$UPSTREAM/commits/dev" --jq .sha)"
          SHORT="$(printf '%s' "$SHA" | cut -c1-8)"

          # release.yml derives the tag the same way, from the version in the
          # package.json AT THAT COMMIT. Recompute it here so the dedup check
          # below tests the tag the build would actually produce.
          VERSION="$(gh api "repos/$UPSTREAM/contents/packages/opencode/package.json?ref=$SHA" \
            --jq .content | base64 -d | jq -r .version)"
          TAG="v${VERSION}-dev.${SHORT}"
          echo "upstream dev head: $SHA (upstream reports v$VERSION) → $TAG"

          # Nothing new since the last dev build we shipped.
          if gh release view "$TAG" --repo "$OURS" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "already released $TAG — no new commits."
            exit 0
          fi

          # dev sitting exactly on a release tag means upstream just cut that
          # release from it. Building it as a dev prerelease would ship a
          # second copy of a tree we either already have or are about to get
          # through the stable path.
          REL_TAG="$(gh release list --repo "$UPSTREAM" --exclude-drafts -L 20 \
            --json tagName --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0].tagName // empty')"
          if [ -n "$REL_TAG" ]; then
            # The commits endpoint takes any ref and returns the COMMIT it
            # resolves to, dereferencing an annotated tag on the way. Going
            # through git/ref/tags instead needs a second call for annotated
            # tags — and on a lightweight tag (which is what upstream uses)
            # that second call 404s, and `gh api --jq` prints the error body
            # to stdout, so the sha silently becomes a JSON blob and this
            # check can never match.
            REL_SHA="$(gh api "repos/$UPSTREAM/commits/$REL_TAG" --jq .sha 2>/dev/null || true)"
            if [ "$REL_SHA" = "$SHA" ]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "dev head is release $REL_TAG — stable path covers it."
              exit 0
            fi
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Dispatch dev prerelease
        if: steps.dev.outputs.build == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.dev.outputs.sha }}
          TAG: ${{ steps.dev.outputs.tag }}
          DRAFT: ${{ inputs.draft || false }}
        run: |
          set -eu
          # Pass the resolved SHA, not "dev": the branch can move between this
          # step and the clone, and then the build would produce a tag other
          # than the one the dedup check above cleared.
          gh workflow run release.yml \
            --ref main \
            -f upstream_ref="$SHA" \
            -f draft="$DRAFT" \
            -f prerelease=true
          echo "dispatched dev build of $SHA → $TAG (prerelease)"

      - name: Dev dry-run summary
        if: steps.dev.outputs.build == 'true' && inputs.dry_run == true
        env:
          SHA: ${{ steps.dev.outputs.sha }}
          TAG: ${{ steps.dev.outputs.tag }}
        run: |
          echo "DRY RUN: would dispatch release.yml for dev commit $SHA → $TAG (prerelease=true)."
